<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  html, body { width: 1280px; height: 520px; }
  .head { position: absolute; left: 56px; top: 44px; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(30% 60% at 100% 55%, var(--amber-glow), transparent 70%); }
  svg.scope { position: absolute; inset: 0; }
  .m { position: absolute; width: 364px; }
  .m.last { width: 262px; }
  .m.up { bottom: calc(520px - 236px); }
  .m.down { top: 332px; }
  .year { font-family: 'Geist Mono', monospace; font-size: 15px; letter-spacing: .14em; color: var(--amber); }
  .title { font-size: 24px; font-weight: 500; letter-spacing: -.01em; margin: 6px 0 0; }
  .cap { font-size: 16.5px; font-weight: 300; line-height: 1.4; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="head kicker">Handing work to machines, since 2002</div>
  <svg class="scope" id="scope" width="1280" height="520" viewBox="0 0 1280 520"></svg>
  <div id="milestones"></div>
</div>
<script>
  const AXIS = 290, FORK = 948, END = 1222;
  const M = [
    { x: 64,  up: true,  year: '2002', title: 'Paper, then process',
      cap: 'Digitised a paper-based claims process, and moved from operations into engineering.' },
    { x: 300, up: false, year: '2012', title: 'Machine learning in production',
      cap: 'Automated advice built on data customers chose to share. Every recommendation explainable.' },
    { x: 540, up: true,  year: '2015', title: 'The question',
      cap: 'What can safely be delegated to a system, and what has to stay with a person?' },
    { x: 740, up: false, year: '2017', title: 'The testbed',
      cap: 'A platform where anything a person can do, an agent can do. About a hundred agents on staff.' },
    { x: FORK, up: true, year: '2026', title: 'In parallel',
      cap: 'One operator, a network of agents, many companies.' },
  ];
  const svg = document.getElementById('scope');
  const host = document.getElementById('milestones');
  const wave = 'fill: none; stroke: var(--amber); stroke-width: 1.6; stroke-linejoin: miter';

  // The single career trace, broken at each milestone node.
  let from = 40;
  M.forEach((m, i) => {
    el('path', { d: squareWave(from, m.x - 12, AXIS, 9, 31 + i * 17), style: wave + '; opacity: .85' }, svg);
    from = m.x + 12;
  });

  // At 2026 the trace forks into one trace per company.
  const LANES = 9, GAP = 12;
  for (let i = 0; i < LANES; i++) {
    const y = AXIS + (i - (LANES - 1) / 2) * GAP;
    const bendEnd = FORK + 64;
    el('path', { d: `M${FORK + 12} ${AXIS} C${FORK + 40} ${AXIS} ${FORK + 36} ${y} ${bendEnd} ${y}`, style: wave }, svg);
    el('path', { d: squareWave(bendEnd, END - 8, y, 5, 400 + i * 53), style: wave + '; stroke-width: 1.3' }, svg);
    el('circle', { cx: END, cy: y, r: 3, style: 'fill: var(--amber-ink)' }, svg);
  }

  M.forEach((m) => {
    const tickY = m.up ? AXIS - 44 : AXIS + 38;
    el('line', { x1: m.x, y1: m.up ? AXIS - 14 : AXIS + 14, x2: m.x, y2: tickY,
      style: 'stroke: var(--dim); stroke-dasharray: 2 3' }, svg);
    el('circle', { cx: m.x, cy: AXIS, r: 12, style: 'fill: var(--amber-glow)' }, svg);
    el('circle', { cx: m.x, cy: AXIS, r: 5, style: 'fill: var(--amber-ink)' }, svg);

    const block = document.createElement('div');
    block.className = `m ${m.up ? 'up' : 'down'}${m.x === FORK ? ' last' : ''}`;
    block.style.left = `${m.x - 8}px`;
    block.innerHTML = `<div class="year">${m.year}</div><div class="title">${m.title}</div><div class="cap">${m.cap}</div>`;
    host.appendChild(block);
  });
</script>
</body>
</html>
