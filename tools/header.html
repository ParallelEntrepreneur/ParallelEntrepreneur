<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  html, body { width: 1280px; height: 500px; }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(42% 70% at 100% 0%, var(--amber-glow), transparent 70%);
  }
  .fade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, transparent 62%);
    opacity: .85;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px;
    display: flex; flex-direction: column; justify-content: center; }
  .name { font-size: 58px; font-weight: 500; letter-spacing: -.025em; line-height: 1; margin: 22px 0 0; }
  .tag { font-size: 25px; font-weight: 300; color: var(--muted); line-height: 1.35; margin: 22px 0 0; }
  .tag b { color: var(--ink); font-weight: 400; }
  .rule { width: 320px; height: 2px; margin: 34px 0 0;
    background: linear-gradient(90deg, var(--amber), transparent); }
  .meta { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin: 18px 0 0; }
  svg.scope { position: absolute; inset: 0; }
  .lbl { font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="fade"></div>
  <svg class="scope" id="scope" width="1280" height="500" viewBox="0 0 1280 500"></svg>
  <div class="copy">
    <div class="kicker">Technical founder</div>
    <p class="name">Parallel Entrepreneur</p>
    <p class="tag">I build companies that run on agents.<br><b>Several at once.</b></p>
    <div class="rule"></div>
    <div class="meta mono">Agent-native companies &nbsp;·&nbsp; Bali &nbsp;·&nbsp; UTC+8</div>
  </div>
</div>
<script>
  const svg = document.getElementById('scope');
  const STAGES = ['SIGNAL', 'VALIDATION', 'PROTOTYPE', 'LAUNCH', 'AUTONOMY', 'SCALE'];
  // One trace per company in the pipeline, at its actual stage. No names.
  const CURRENT = [2, 3, 1, 1, 1, 2, 1, 1, 1, 1, 1];
  const X0 = 716, STEP = 98, TOP = 146, ROW = 30, AMP = 10;
  const xAt = (k) => X0 + k * STEP;
  const END = xAt(STAGES.length - 1);

  el('text', { x: X0 - 34, y: 88, class: 'lbl', style: 'fill: var(--amber)' }, svg)
    .textContent = `${String(CURRENT.length).padStart(2, '0')} COMPANIES · IN PARALLEL`;

  STAGES.forEach((name, k) => {
    const x = xAt(k);
    el('line', { x1: x, y1: 118, x2: x, y2: TOP + ROW * (CURRENT.length - 1) + 22,
      style: 'stroke: var(--line); stroke-dasharray: 2 4' }, svg);
    el('text', { x, y: 112, 'text-anchor': 'middle', class: 'lbl', style: 'fill: var(--dim); font-size: 9.5px' }, svg)
      .textContent = name;
  });

  CURRENT.forEach((stage, i) => {
    const y = TOP + i * ROW + AMP;
    const cx = xAt(stage);
    el('text', { x: X0 - 34, y: y - 2, class: 'lbl', style: 'fill: var(--dim)' }, svg)
      .textContent = String(i + 1).padStart(2, '0');
    el('path', { d: squareWave(X0, cx - 10, y, AMP, 97 + i * 131),
      style: 'fill: none; stroke: var(--amber); stroke-width: 1.6; stroke-linejoin: miter; opacity: .92' }, svg);
    el('line', { x1: cx + 12, y1: y, x2: END, y2: y,
      style: 'stroke: var(--dim); stroke-width: 1.2; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .8' }, svg);
    el('circle', { cx, cy: y, r: 11, style: 'fill: var(--amber-glow)' }, svg);
    el('circle', { cx, cy: y, r: 4.5, style: 'fill: var(--amber-ink)' }, svg);
  });
</script>
</body>
</html>
