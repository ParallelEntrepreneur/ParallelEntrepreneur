name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline: only relative links and fragments. External links are checked
      # weekly in links.yml so a third-party outage never blocks a merge.
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline README.md 'tools/*.html'
          fail: true
          output: ${{ runner.temp }}/lychee.md

  assets:
    name: Assets and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SVG well-formedness
        run: |
          python3 - <<'PY'
          import subprocess, sys
          import xml.etree.ElementTree as ET

          files = subprocess.run(
              ["git", "ls-files", "*.svg"], capture_output=True, text=True, check=True
          ).stdout.split()

          bad = []
          for f in files:
              try:
                  ET.parse(f)
              except Exception as exc:
                  bad.append(f"{f}: {exc}")

          if bad:
              for line in bad:
                  print(f"not well-formed: {line}", file=sys.stderr)
              sys.exit(1)
          print(f"{len(files)} SVG files are well-formed")
          PY

      - name: Compile build-icons.py
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m py_compile tools/build-icons.py

      - name: Parse render.sh
        run: bash -n tools/render.sh

      # shellcheck ships with the ubuntu-latest runner image.
      - name: Lint render.sh
        run: shellcheck tools/render.sh